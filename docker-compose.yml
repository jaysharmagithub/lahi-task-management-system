services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanagement-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskManagementDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - Jwt__Secret=CHANGE_ME_TO_A_32_CHAR_MIN_SECRET_KEY_IN_PRODUCTION
      - Jwt__Issuer=TaskManagement
      - Jwt__Audience=TaskManagement
      - Email__Host=mailhog
      - Email__Port=1025
      - Email__From=noreply@taskmanagement.com
      - FileStorage__BasePath=/app/uploads
      - AllowedOrigins__0=http://localhost:4200
    depends_on:
      - db
    networks:
      - tasknet

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanagement-db
    user: root # Fixes "Exited (1)" permission issues on Linux
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1450:1433" # Using unique port 1450 to avoid any host conflicts
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - tasknet

  mailhog:
    image: mailhog/mailhog:latest
    container_name: taskmanagement-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tasknet

volumes:
  sqldata:

networks:
  tasknet:
    driver: bridge
